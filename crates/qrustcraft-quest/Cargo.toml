[package]
name = "qrustcraft-quest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The QRustCraft Android/Quest app (NativeActivity cdylib). On other platforms this crate is empty."

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
qrustcraft-xr = { path = "../qrustcraft-xr", features = ["wgpu-bridge", "android"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
